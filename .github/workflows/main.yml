name: CI
on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - run: npm i
    - run: |
        echo ">>> Start compile vscode-office."
        npm run build
        echo ">>> Compile vscode-office sucess!"
  docx:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - run: npm install --ignore-scripts
    - run: npm run test:docx
    - run: dotnet run --project test/docx-validator -- test/output/docx
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docx-fixtures-${{ matrix.os }}
        path: test/output/docx
